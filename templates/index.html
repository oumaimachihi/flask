<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time System Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

      <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }
    .wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      color: #f8fafc;
    }
    .sub {
      color: #94a3b8;
      font-size: 14px;
    }
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #334155;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      cursor: grab;
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 16px;
      color: #f8fafc;
    }
    .value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .meta {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }
    .progress {
      width: 100%;
      height: 10px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
      transition: width 0.5s ease;
    }
    .status-up {
      color: #22c55e;
      font-weight: 700;
    }
    .status-down {
      color: #ef4444;
      font-weight: 700;
    }
    .footer-note {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>
    <header class="header">
        <h1>Real-Time System Monitor</h1>
        <div class="actions">
            <button id="refresh-btn">Refresh Now</button>
            <button id="toggle-auto-btn">Pause Auto Refresh</button>
        </div>
    </header>

    <main class="dashboard" id="dashboard">
        <section class="card">
            <h2>CPU Usage</h2>
            <p id="cpu-value">0%</p>
            <div class="progress"><div id="cpu-bar" class="progress-bar"></div></div>
        </section>

        <section class="card">
            <h2>RAM Usage</h2>
            <p id="ram-value">0%</p>
            <div class="progress"><div id="ram-bar" class="progress-bar"></div></div>
        </section>

        <section class="card">
            <h2>Disk Usage</h2>
            <p id="disk-value">0%</p>
            <div class="progress"><div id="disk-bar" class="progress-bar"></div></div>
        </section>

        <section class="card">
            <h2>IP Address</h2>
            <p id="ip-value">Loading...</p>
        </section>

        <section class="card">
            <h2>MAC Address</h2>
            <p id="mac-value">Loading...</p>
        </section>

        <section class="card">
            <h2>Network Status</h2>
            <p id="network-value">Loading...</p>
        </section>

        <section class="card">
            <h2>Hostname</h2>
            <p id="hostname-value">Loading...</p>
        </section>

        <section class="card">
            <h2>Operating System</h2>
            <p id="os-value">Loading...</p>
        </section>

        <section class="card">
            <h2>Processor</h2>
            <p id="processor-value">Loading...</p>
        </section>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
