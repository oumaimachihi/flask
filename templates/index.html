<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time System Monitor</title>
  
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }
    .wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      color: #f8fafc;
    }
    .sub {
      color: #94a3b8;
      font-size: 14px;
    }
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #334155;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      cursor: grab;
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 16px;
      color: #f8fafc;
    }
    .value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .meta {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }
    .progress {
      width: 100%;
      height: 10px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
      transition: width 0.5s ease;
    }
    .status-up {
      color: #22c55e;
      font-weight: 700;
    }
    .status-down {
      color: #ef4444;
      font-weight: 700;
    }
    .footer-note {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div>
        <div class="title">Real-Time System Monitor</div>
      </div>
      <div class="buttons">
        <button onclick="refreshStats()">Refresh now</button>
        <button class="secondary" onclick="toggleAutoUpdate()" id="toggleBtn">Pause auto update</button>
      </div>
    </div>

    <div class="grid" id="dashboard">
      <div class="card">
        <h3>CPU Usage</h3>
        <div class="value" id="cpuValue">0%</div>
        <div class="meta" id="processorText">Processor: --</div>
        <div class="progress"><div class="bar" id="cpuBar"></div></div>
      </div>

      <div class="card">
        <h3>RAM Usage</h3>
        <div class="value" id="ramValue">0%</div>
        <div class="meta" id="ramText">Used: -- / -- GB</div>
        <div class="progress"><div class="bar" id="ramBar"></div></div>
      </div>

      <div class="card">
        <h3>Disk Usage</h3>
        <div class="value" id="diskValue">0%</div>
        <div class="meta" id="diskText">Used: -- / -- GB</div>
        <div class="progress"><div class="bar" id="diskBar"></div></div>
      </div>

      <div class="card">
        <h3>Network Status</h3>
        <div class="value" id="netStatus">--</div>
        <div class="meta" id="ifaceText">Interface: --</div>
        <div class="meta" id="ipText">IP: --</div>
        <div class="meta" id="macText">MAC: --</div>
      </div>

      <div class="card">
        <h3>Host Info</h3>
        <div class="value" id="systemValue">--</div>
        <div class="meta" id="hostText">Hostname: --</div>
        <div class="meta" id="timeText">Updated: --</div>
      </div>
    </div>
  </div>

  <script>
    let autoUpdate = true;
    let intervalId = null;

    new Sortable(document.getElementById('dashboard'), {
      animation: 150,
      ghostClass: 'sortable-ghost'
    });

    async function refreshStats() {
      const res = await fetch('/stats');
      const data = await res.json();

      document.getElementById('cpuValue').textContent = data.cpu_percent + '%';
      document.getElementById('ramValue').textContent = data.ram_percent + '%';
      document.getElementById('diskValue').textContent = data.disk_percent + '%';

      document.getElementById('processorText').textContent = 'Processor: ' + data.processor;
      document.getElementById('ramText').textContent = `Used: ${data.ram_used_gb} / ${data.ram_total_gb} GB`;
      document.getElementById('diskText').textContent = `Used: ${data.disk_used_gb} / ${data.disk_total_gb} GB`;

      document.getElementById('ifaceText').textContent = 'Interface: ' + data.interface;
      document.getElementById('ipText').textContent = 'IP: ' + data.ip_address;
      document.getElementById('macText').textContent = 'MAC: ' + data.mac_address;

      const statusEl = document.getElementById('netStatus');
      statusEl.textContent = data.network_status;
      statusEl.className = data.network_status === 'Up' ? 'value status-up' : 'value status-down';

      document.getElementById('systemValue').textContent = data.system;
      document.getElementById('hostText').textContent = 'Hostname: ' + data.hostname;
      document.getElementById('timeText').textContent = 'Updated: ' + data.time;

      document.getElementById('cpuBar').style.width = data.cpu_percent + '%';
      document.getElementById('ramBar').style.width = data.ram_percent + '%';
      document.getElementById('diskBar').style.width = data.disk_percent + '%';
    }

    function startAutoUpdate() {
      intervalId = setInterval(() => {
        if (autoUpdate) refreshStats();
      }, 1000);
    }

    function toggleAutoUpdate() {
      autoUpdate = !autoUpdate;
      document.getElementById('toggleBtn').textContent =
        autoUpdate ? 'Pause auto update' : 'Resume auto update';
    }

    refreshStats();
    startAutoUpdate();
  </script>
</body>
</html>
